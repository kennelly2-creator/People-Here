<style>
/* People Here — self-contained stylesheet.
   Tokens copied from the Broadsheet design system so the deployed
   static site has no external dependency beyond the webfont. */

:root {
  --color-bg: #f3f2f2;
  --color-surface: #eae9e9;
  --color-text: #201e1d;
  --color-accent: #0088b0;
  --color-accent-2: #d6006c;
  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);

  --color-neutral-200: #eae7e7;
  --color-neutral-300: #d7d3d3;
  --color-neutral-400: #bab6b6;
  --color-neutral-600: #7d7979;
  --color-neutral-700: #605d5d;
  --color-neutral-800: #444141;
  --color-neutral-900: #2d2b2b;

  --color-accent-100: #e9f8ff;
  --color-accent-200: #cbeeff;
  --color-accent-600: #1186ac;
  --color-accent-700: #006786;
  --color-accent-800: #004961;

  --color-accent-2-100: #fff1f4;
  --color-accent-2-700: #aa0b56;
  --color-accent-2-800: #790e3d;

  --font-heading: "Source Serif 4", Georgia, serif;
  --font-body: "Source Serif 4", Georgia, serif;

  --space-1: 5px;
  --space-2: 10px;
  --space-3: 15px;
  --space-4: 20px;
  --space-6: 30px;
  --space-8: 40px;

  --radius-sm: 1px;
  --radius-md: 2px;
  --radius-lg: 4px;

  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);

  --pad: max(var(--space-4), env(safe-area-inset-left));
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  padding: 0 var(--pad) calc(var(--space-8) + env(safe-area-inset-bottom));
}

::selection { background: var(--color-accent-200); }

:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}

a { color: var(--color-accent-700); }
a:hover { color: var(--color-accent-800); }

.skip {
  position: absolute;
  left: -9999px;
}
.skip:focus {
  position: static;
  display: inline-block;
  padding: var(--space-2);
}

/* ---------- masthead ---------- */

.masthead {
  padding: calc(var(--space-6) + env(safe-area-inset-top)) 0 var(--space-4);
}

.brand {
  display: inline-block;
  font-family: var(--font-heading);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--color-text);
  text-decoration: none;
}
.brand:hover { color: var(--color-accent-700); }

.brand-sub {
  margin: var(--space-1) 0 0;
  font-style: italic;
  font-size: 17px;
  color: var(--color-neutral-700);
}

/* ---------- type ---------- */

h1 {
  font-family: var(--font-heading);
  font-weight: 600;
  font-size: 40px;
  line-height: 1.08;
  letter-spacing: -0.015em;
  margin: 0 0 var(--space-2);
  text-wrap: pretty;
}

h2 {
  font-family: var(--font-heading);
  font-weight: 600;
  font-size: 22px;
  line-height: 1.2;
  margin: 0;
}

.kicker {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-neutral-700);
  margin: 0 0 var(--space-2);
}

.lede {
  font-size: 19px;
  color: var(--color-neutral-800);
  margin: 0 0 var(--space-4);
  max-width: 34ch;
  text-wrap: pretty;
}

.meta {
  font-size: 16px;
  color: var(--color-neutral-700);
  margin: 0;
}

.back {
  display: inline-block;
  min-height: 44px;
  line-height: 44px;
  font-size: 17px;
  text-decoration: none;
  color: var(--color-accent-700);
}
.back:active { color: var(--color-accent-800); }

/* ---------- buttons ---------- */

.btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: 52px;
  padding: 0 var(--space-4);
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--color-text);
  font-family: var(--font-heading);
  font-size: 19px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  touch-action: manipulation;
}

.btn-primary {
  background: var(--color-accent-700);
  color: #fff;
}
.btn-primary:active { background: var(--color-accent-800); }

.btn-secondary {
  border-color: var(--color-text);
  color: var(--color-text);
}
.btn-secondary:active { background: var(--color-neutral-200); }

.btn-ghost { color: var(--color-accent-700); }
.btn-ghost:active { background: var(--color-accent-100); }

.btn-danger {
  border-color: var(--color-accent-2-700);
  color: var(--color-accent-2-700);
}
.btn-danger:active { background: var(--color-accent-2-100); }

.btn-block { width: 100%; }

.btn-hero {
  min-height: 76px;
  font-size: 26px;
  letter-spacing: -0.01em;
}

.btn:disabled { opacity: 0.45; cursor: default; }

.actions {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin-top: var(--space-6);
}

/* ---------- place list ---------- */

.places {
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
  margin: var(--space-8) 0 0;
  padding: 0;
  list-style: none;
}

.place-link {
  display: block;
  text-decoration: none;
  color: inherit;
  padding: var(--space-1) 0;
}
.place-link:active .place-name { color: var(--color-accent-700); }

.place-name {
  font-family: var(--font-heading);
  font-weight: 600;
  font-size: 27px;
  line-height: 1.15;
  letter-spacing: -0.01em;
  margin: 0;
}

.place-people {
  margin: 2px 0 0;
  font-size: 18px;
  color: var(--color-neutral-800);
}

.place-count {
  margin: 2px 0 0;
  font-size: 15px;
  letter-spacing: 0.04em;
  color: var(--color-neutral-600);
}

.dist {
  font-variant-numeric: tabular-nums;
  color: var(--color-accent-700);
}

/* ---------- people ---------- */

.people {
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
  margin: var(--space-6) 0 0;
  padding: 0;
  list-style: none;
}

.person-name {
  font-family: var(--font-heading);
  font-weight: 600;
  font-size: 34px;
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin: 0;
}

.person-say {
  margin: 2px 0 0;
  font-size: 17px;
  font-style: italic;
  color: var(--color-accent-700);
}

.person-role {
  margin: var(--space-1) 0 0;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--color-neutral-700);
}

.person-note {
  margin: var(--space-1) 0 0;
  font-size: 19px;
  max-width: 36ch;
  text-wrap: pretty;
}

.person-seen {
  margin: var(--space-1) 0 0;
  font-size: 15px;
  color: var(--color-neutral-600);
}

.person-edit {
  display: inline-block;
  min-height: 44px;
  line-height: 44px;
  font-size: 16px;
  color: var(--color-accent-700);
  text-decoration: none;
}

/* ---------- forms ---------- */

.form {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  margin-top: var(--space-4);
  max-width: 34rem;
}

.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.field label {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--color-neutral-700);
}

.field .hint {
  font-size: 15px;
  font-style: italic;
  color: var(--color-neutral-600);
}

.input {
  width: 100%;
  min-height: 52px;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-neutral-400);
  border-radius: var(--radius-md);
  background: #fff;
  color: var(--color-text);
  font-family: var(--font-body);
  font-size: 19px;
}
.input:focus-visible { border-color: var(--color-accent); }

.row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-3);
}

.coords {
  font-variant-numeric: tabular-nums;
}

.captured {
  margin: 0;
  font-size: 16px;
  color: var(--color-accent-700);
}
.captured[data-state="error"] { color: var(--color-accent-2-700); }

/* ---------- notices ---------- */

.notice {
  margin: var(--space-4) 0 0;
  padding: var(--space-3) 0 0;
  border-top: 2px solid var(--color-accent-2-700);
  font-size: 18px;
  max-width: 36ch;
  text-wrap: pretty;
}

.here {
  margin: 0 0 var(--space-2);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-accent-2-700);
}

.toast {
  position: fixed;
  left: var(--pad);
  right: var(--pad);
  bottom: calc(var(--space-4) + env(safe-area-inset-bottom));
  padding: var(--space-3);
  background: var(--color-neutral-900);
  color: #fff;
  border-radius: var(--radius-md);

/* ---- distance.js ---- */
/* distance.js — geographic distance utilities. No dependencies. */
(function (global) {
  'use strict';

  var EARTH_RADIUS_M = 6371008.8;

  function toRad(deg) { return (deg * Math.PI) / 180; }

  /* Great-circle distance in metres between two lat/lon pairs (Haversine). */
  function haversineMeters(lat1, lon1, lat2, lon2) {
    var dLat = toRad(lat2 - lat1);
    var dLon = toRad(lon2 - lon1);
    var a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * EARTH_RADIUS_M * Math.asin(Math.min(1, Math.sqrt(a)));
  }

  function formatDistance(m) {
    if (!isFinite(m)) return '—';
    if (m < 950) return Math.round(m) + ' m';
    return (m / 1000).toFixed(m < 9500 ? 1 : 0) + ' km';
  }

  function isValidLat(v) { return typeof v === 'number' && isFinite(v) && v >= -90 && v <= 90; }
  function isValidLon(v) { return typeof v === 'number' && isFinite(v) && v >= -180 && v <= 180; }

  /* Places, each measured against a coordinate, nearest first. */
  function rankPlaces(places, lat, lon) {
    return places
      .map(function (p) {
        var d = haversineMeters(lat, lon, p.latitude, p.longitude);
        return { place: p, meters: d, inside: d <= (p.radiusMeters || 150) };
      })
      .sort(function (a, b) { return a.meters - b.meters; });
  }

  global.Distance = {
    haversineMeters: haversineMeters,
    formatDistance: formatDistance,
    rankPlaces: rankPlaces,
    isValidLat: isValidLat,
    isValidLon: isValidLon
  };
})(window);

/* ---- db.js ---- */
/* db.js — IndexedDB data-access layer for People Here.
   Everything stays on this device. Nothing is sent anywhere. */
(function (global) {
  'use strict';

  var DB_NAME = 'people-here';
  var DB_VERSION = 1;
  var dbPromise = null;

  function open() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      if (!global.indexedDB) {
        reject(new Error('This browser has no local database (IndexedDB), so People Here cannot save anything.'));
        return;
      }
      var req;
      try {
        req = global.indexedDB.open(DB_NAME, DB_VERSION);
      } catch (err) {
        reject(new Error('Local storage is unavailable. Private browsing can block it.'));
        return;
      }
      req.onupgradeneeded = function (event) {
        var db = req.result;
        // v1: places + people. Future versions extend here by oldVersion.
        if (event.oldVersion < 1) {
          db.createObjectStore('places', { keyPath: 'id' });
          var people = db.createObjectStore('people', { keyPath: 'id' });
          people.createIndex('placeId', 'placeId', { unique: false });
        }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error('Could not open local storage.')); };
      req.onblocked = function () { reject(new Error('Local storage is busy in another tab. Close other People Here tabs and reload.')); };
    });
    return dbPromise;
  }

  function tx(stores, mode, work) {
    return open().then(function (db) {
      return new Promise(function (resolve, reject) {
        var t = db.transaction(stores, mode);
        var out;
        t.oncomplete = function () { resolve(out); };
        t.onerror = function () { reject(t.error || new Error('Could not save. Please try again.')); };
        t.onabort = function () { reject(t.error || new Error('The write was cancelled.')); };
        try {
          out = work(t);
        } catch (err) {
          try { t.abort(); } catch (e) {}
          reject(err);
        }
      });
    });
  }

  function req(request, onResult) {
    request.onsuccess = function () { onResult(request.result); };
  }

  function all(store) {
    return new Promise(function (resolve, reject) {
      var r = store.getAll();
      r.onsuccess = function () { resolve(r.result); };

  function id() {
    if (global.crypto && global.crypto.randomUUID) return global.crypto.randomUUID();

  function now() { return new Date().toISOString(); }

  function trim(v) { return typeof v === 'string' ? v.trim() : ''; }

  /* ---------------- places ---------------- */

  var Places = {
    list: function () {
      return tx(['places'], 'readonly', function (t) {
        return all(t.objectStore('places'));
      }).then(function (rows) {
        return (rows || []).sort(function (a, b) { return a.name.localeCompare(b.name); });
      });
    },

    get: function (placeId) {
      return tx(['places'], 'readonly', function (t) {
        var out = null;
        req(t.objectStore('places').get(placeId), function (r) { out = r || null; });
        return new Promise(function (resolve) {
          t.addEventListener('complete', function () { resolve(out); });

      }).then(function (p) { return p; });
    },

    create: function (data) {
      var record = {
        id: id(),
        name: trim(data.name),
        latitude: Number(data.latitude),
        longitude: Number(data.longitude),
        radiusMeters: Number(data.radiusMeters) || 150,
        createdAt: now(),
        updatedAt: now()

      validatePlace(record);
      return tx(['places'], 'readwrite', function (t) {
        t.objectStore('places').add(record);
        return record;
      });
    },

    update: function (placeId, patch) {
      return Places.get(placeId).then(function (existing) {
        if (!existing) throw new Error('That place no longer exists.');
        var record = Object.assign({}, existing, {
          name: patch.name !== undefined ? trim(patch.name) : existing.name,
          latitude: patch.latitude !== undefined ? Number(patch.latitude) : existing.latitude,
          longitude: patch.longitude !== undefined ? Number(patch.longitude) : existing.longitude,
          radiusMeters: patch.radiusMeters !== undefined ? Number(patch.radiusMeters) || 150 : existing.radiusMeters,
          updatedAt: now()
        });
        validatePlace(record);
        return tx(['places'], 'readwrite', function (t) {
          t.objectStore('places').put(record);
          return record;
        });
      });
    },

    /* Removes the place and every person saved under it. */
    remove: function (placeId) {
      return tx(['places', 'people'], 'readwrite', function (t) {
        t.objectStore('places').delete(placeId);
        var index = t.objectStore('people').index('placeId');
        var cursorReq = index.openCursor(IDBKeyRange.only(placeId));
        cursorReq.onsuccess = function () {
          var cursor = cursorReq.result;
          if (cursor) { cursor.delete(); cursor.continue(); }
        };

      });
    }
  };

  function validatePlace(record) {
    if (!record.name) throw new Error('Please give the place a name.');
    if (!global.Distance.isValidLat(record.latitude)) throw new Error('Latitude must be a number between -90 and 90.');
    if (!global.Distance.isValidLon(record.longitude)) throw new Error('Longitude must be a number between -180 and 180.');
    if (!(record.radiusMeters > 0)) throw new Error('Radius must be greater than zero.');
  }

  /* ---------------- people ---------------- */

  function byAdded(a, b) {
    return a.createdAt.localeCompare(b.createdAt) || a.name.localeCompare(b.name);
  }

  var People = {
    listByPlace: function (placeId) {
      return tx(['people'], 'readonly', function (t) {
        var out = [];
        var r = t.objectStore('people').index('placeId').getAll(IDBKeyRange.only(placeId));
        r.onsuccess = function () { out = r.result || []; };
        return new Promise(function (resolve) {
          t.addEventListener('complete', function () { resolve(out); });
        });
      }).then(function (rows) {
        return (rows || []).sort(byAdded);
      });
    },

    countsByPlace: function () {
      return tx(['people'], 'readonly', function (t) {
        return all(t.objectStore('people'));
      }).then(function (rows) {
        var map = {};
        (rows || []).forEach(function (p) {
          (map[p.placeId] = map[p.placeId] || []).push(p);
        });
        Object.keys(map).forEach(function (k) { map[k].sort(byAdded); });
        return map;
      });
    },

    get: function (personId) {
      return tx(['people'], 'readonly', function (t) {
        var out = null;
        req(t.objectStore('people').get(personId), function (r) { out = r || null; });
        return new Promise(function (resolve) {
          t.addEventListener('complete', function () { resolve(out); });
        });
      });
    },

    create: function (data) {
      var record = {
        id: id(),
        placeId: data.placeId,
        name: trim(data.name),
        role: trim(data.role),
        note: trim(data.note),
        pronunciation: trim(data.pronunciation),
        lastSeenAt: trim(data.lastSeenAt),
        createdAt: now(),
        updatedAt: now()
      };
      if (!record.name) throw new Error('Please enter a name.');
      if (!record.placeId) throw new Error('That person needs a place.');
      return tx(['people'], 'readwrite', function (t) {
        t.objectStore('people').add(record);
        return record;
      });
    },

    update: function (personId, patch) {
      return People.get(personId).then(function (existing) {
        if (!existing) throw new Error('That person no longer exists.');
        var record = Object.assign({}, existing, {
          name: trim(patch.name !== undefined ? patch.name : existing.name),
          role: trim(patch.role !== undefined ? patch.role : existing.role),
          note: trim(patch.note !== undefined ? patch.note : existing.note),
          pronunciation: trim(patch.pronunciation !== undefined ? patch.pronunciation : existing.pronunciation),
          lastSeenAt: trim(patch.lastSeenAt !== undefined ? patch.lastSeenAt : existing.lastSeenAt),
          updatedAt: now()
        });
        if (!record.name) throw new Error('Please enter a name.');
        return tx(['people'], 'readwrite', function (t) {
          t.objectStore('people').put(record);
          return record;
        });
      });
    },

    remove: function (personId) {
      return tx(['people'], 'readwrite', function (t) {
        t.objectStore('people').delete(personId);
        return true;
      });
    }

  function exportAll() {
    return Promise.all([Places.list(), People.countsByPlace()]).then(function (r) {
      var people = [];
      Object.keys(r[1]).forEach(function (k) { people = people.concat(r[1][k]); });

  global.DB = { open: open, Places: Places, People: People, exportAll: exportAll };

/* ---- location.js ---- */
/* location.js — one wrapper around the Geolocation API with plain-language errors. */
(function (global) {
  'use strict';

  function getCurrentPosition(opts) {
    return new Promise(function (resolve, reject) {
      if (!global.navigator || !global.navigator.geolocation) {
        reject(new Error('This browser cannot share your location. Enter the coordinates by hand instead.'));
        return;
      }
      var options = Object.assign({
        enableHighAccuracy: true,
        timeout: 12000,
        maximumAge: 30000

      global.navigator.geolocation.getCurrentPosition(
        function (pos) {
          resolve({
            latitude: pos.coords.latitude,
            longitude: pos.coords.longitude,
            accuracy: pos.coords.accuracy,
            at: new Date(pos.timestamp).toISOString()
          });
        },
        function (err) {
          reject(new Error(message(err)));
        },
        options
      );
    });

  function message(err) {
    if (!err) return 'Could not get your location.';
    switch (err.code) {
      case 1: return 'Location permission is off. Turn it on in Settings → Safari → Location, then try again.';
      case 2: return 'Your location is unavailable right now. Try again outdoors or enter coordinates by hand.';
      case 3: return 'Getting your location took too long. Try again.';
      default: return 'Could not get your location.';

})(window);

/* ---- app.js ---- */
/* app.js — views + hash routing for People Here. */
(function () {
  'use strict';

  var view = document.getElementById('view');
  var toastEl = document.getElementById('toast');
  var confirmEl = document.getElementById('confirm');
  var toastTimer = null;
  var lastFix = null; // most recent geolocation reading this session

  /* ---------------- tiny DOM helper ---------------- */

  function h(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') node.className = v;
        else if (k === 'text') node.textContent = v;
        else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? '' : v);
      });
    }
    (Array.isArray(children) ? children : children ? [children] : []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  function render(nodes) {
    view.textContent = '';
    (Array.isArray(nodes) ? nodes : [nodes]).forEach(function (n) { if (n) view.appendChild(n); });
    window.scrollTo(0, 0);
  }

  function toast(msg, tone) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    toastEl.style.background = tone === 'error' ? 'var(--color-accent-2-800)' : 'var(--color-neutral-900)';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 4200);
  }

  function askConfirm(title, body, label) {
    return new Promise(function (resolve) {
      var opener = document.activeElement;
      confirmEl.querySelector('#confirm-title').textContent = title;
      confirmEl.querySelector('#confirm-body').textContent = body;
      var yes = confirmEl.querySelector('[data-confirm="yes"]');
      var no = confirmEl.querySelector('[data-confirm="no"]');
      yes.textContent = label || 'Delete';
      confirmEl.hidden = false;
      yes.focus();

      function close(answer) {
        confirmEl.hidden = true;
        yes.removeEventListener('click', onYes);
        no.removeEventListener('click', onNo);
        document.removeEventListener('keydown', onKey);
        if (opener && opener.focus) opener.focus();
        resolve(answer);
      }
      function onYes() { close(true); }
      function onNo() { close(false); }
      function onKey(e) {
        if (e.key === 'Escape') close(false);
        if (e.key === 'Tab') {
          e.preventDefault();

      no.addEventListener('click', onNo);
      document.addEventListener('keydown', onKey);

  }

    console.error(err);

  /* ---------------- formatting ---------------- */

  function peopleWord(n) { return n === 1 ? '1 person' : n + ' people'; }

  function prettyDate(iso) {
    if (!iso) return '';

    if (isNaN(d)) return iso;
    return d.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
  }

  /* ---------------- home ---------------- */

  function viewHome() {
    return Promise.all([window.DB.Places.list(), window.DB.People.countsByPlace()])
      .then(function (r) {
        var places = r[0], byPlace = r[1];

        var hero = h('button', {
          class: 'btn btn-primary btn-block btn-hero',
          type: 'button',
          onclick: function () { go('#/where'); }
        }, 'Where am I?');

        var nodes = [h('h1', { text: 'Who do I know here?' }), hero];

        if (!places.length) {
          nodes.push(h('p', { class: 'lede', style: 'margin-top:var(--space-6)' },
            'Nothing saved yet. Add a place you visit often, then add the people you meet there.'));
        } else {
          nodes.push(h('ul', { class: 'places' }, places.map(function (p) {
            var people = byPlace[p.id] || [];
            var names = people.slice(0, 4).map(function (x) { return x.name; }).join(' · ');
            return h('li', null, h('a', { class: 'place-link', href: '#/place/' + p.id }, [
              h('p', { class: 'place-name', text: p.name }),
              people.length ? h('p', { class: 'place-people', text: names + (people.length > 4 ? ' …' : '') }) : null,
              h('p', { class: 'place-count', text: people.length ? peopleWord(people.length) : 'No one saved yet' })
            ]));
          })));
        }

        nodes.push(h('div', { class: 'actions' }, [
          h('a', { class: 'btn btn-secondary btn-block', href: '#/add-place' }, '+ Add place')
        ]));

        nodes.push(h('p', { class: 'footnote' },
          'Everything you save stays in this browser on this device. Clearing Safari website data will delete it.'));

        render(nodes);
      })
      .catch(function (err) {
        render([
          h('h1', { text: 'Storage unavailable' }),
          h('p', { class: 'lede', text: err.message })
        ]);
      });
  }

  /* ---------------- where am I ---------------- */

  function viewWhere() {
    render([
      h('a', { class: 'back', href: '#/' }, '← Home'),
      h('h1', { text: 'Looking around…' }),
      h('p', { class: 'lede', text: 'Getting your location.' })
    ]);

    return Promise.all([window.Loc.getCurrentPosition(), window.DB.Places.list()])
      .then(function (r) {
        var fix = r[0], places = r[1];
        lastFix = fix;

        if (!places.length) {
          render([
            h('a', { class: 'back', href: '#/' }, '← Home'),
            h('h1', { text: 'No places saved' }),
            h('p', { class: 'lede' }, 'Save where you are now, then add the people you meet here.'),
            h('div', { class: 'actions' }, [
              h('a', {
                class: 'btn btn-primary btn-block',
                href: '#/add-place?lat=' + fix.latitude + '&lon=' + fix.longitude
              }, 'Save this location as a place')
            ])
          ]);
          return;
        }

        var ranked = window.Distance.rankPlaces(places, fix.latitude, fix.longitude);
        var here = ranked[0] && ranked[0].inside ? ranked[0] : null;

        if (here) {
          return window.DB.People.listByPlace(here.place.id).then(function (people) {
            render([
              h('a', { class: 'back', href: '#/' }, '← Home'),
              h('p', { class: 'here', text: "You're at" }),
              h('h1', { text: here.place.name }),
              h('p', { class: 'meta', text: 'About ' + window.Distance.formatDistance(here.meters) + ' away' }),
              people.length
                ? h('ul', { class: 'people' }, people.map(personItem))
                : h('p', { class: 'lede', style: 'margin-top:var(--space-6)', text: 'No one saved here yet.' }),
              h('div', { class: 'actions' }, [
                h('a', { class: 'btn btn-secondary btn-block', href: '#/place/' + here.place.id + '/add-person' }, '+ Add person'),
                h('a', { class: 'btn btn-ghost btn-block', href: '#/place/' + here.place.id }, 'Open ' + here.place.name)
              ])
            ]);
          });
        }

        render([
          h('a', { class: 'back', href: '#/' }, '← Home'),
          h('h1', { text: 'Nothing saved here' }),
          h('p', { class: 'lede', text: 'No saved place matches your current location.' }),
          h('p', { class: 'kicker', style: 'margin-top:var(--space-6)', text: 'Closest saved places' }),
          h('ul', { class: 'places' }, ranked.slice(0, 5).map(function (item) {
            return h('li', null, h('a', { class: 'place-link', href: '#/place/' + item.place.id }, [
              h('p', { class: 'place-name', text: item.place.name }),
              h('p', { class: 'place-count' }, h('span', { class: 'dist', text: window.Distance.formatDistance(item.meters) + ' away' }))
            ]));
          })),
          h('div', { class: 'actions' }, [
            h('a', {
              class: 'btn btn-primary btn-block',
              href: '#/add-place?lat=' + fix.latitude + '&lon=' + fix.longitude
            }, 'Save this location as a new place')
          ])
        ]);
      })
      .catch(function (err) {
        render([
          h('a', { class: 'back', href: '#/' }, '← Home'),
          h('h1', { text: 'Location unavailable' }),
          h('p', { class: 'notice', text: err.message }),
          h('div', { class: 'actions' }, [
            h('button', { class: 'btn btn-secondary btn-block', type: 'button', onclick: function () { viewWhere(); } }, 'Try again'),

      });
  }

  /* ---------------- place detail ---------------- */

  function personItem(person) {
    return h('li', null, [
      h('p', { class: 'person-name', text: person.name }),
      person.pronunciation ? h('p', { class: 'person-say', text: 'say ' + person.pronunciation }) : null,
      person.role ? h('p', { class: 'person-role', text: person.role }) : null,
      person.note ? h('p', { class: 'person-note', text: person.note }) : null,
      person.lastSeenAt ? h('p', { class: 'person-seen', text: 'Last seen ' + prettyDate(person.lastSeenAt) }) : null,

  function viewPlace(placeId) {
    return Promise.all([window.DB.Places.get(placeId), window.DB.People.listByPlace(placeId)])
      .then(function (r) {
        var place = r[0], people = r[1];
        if (!place) return viewMissing();
        render([
          h('a', { class: 'back', href: '#/' }, '← Home'),
          h('h1', { text: place.name }),
          h('p', { class: 'meta', text: people.length ? peopleWord(people.length) : 'No one saved yet' }),
          people.length
            ? h('ul', { class: 'people' }, people.map(personItem))
            : h('p', { class: 'lede', style: 'margin-top:var(--space-6)', text: 'Add the first person you meet here.' }),
          h('div', { class: 'actions' }, [
            h('a', { class: 'btn btn-primary btn-block', href: '#/place/' + place.id + '/add-person' }, '+ Add person'),
            h('a', { class: 'btn btn-ghost btn-block', href: '#/place/' + place.id + '/edit' }, 'Edit place')
          ])
        ]);
      })
      .catch(fail);
  }

  function viewMissing() {
    render([
      h('a', { class: 'back', href: '#/' }, '← Home'),
      h('h1', { text: 'Not found' }),
      h('p', { class: 'lede', text: 'That item is no longer saved.' })
    ]);
  }

  /* ---------------- place form ---------------- */

  function field(label, inputAttrs, hint) {
    var input = h('input', Object.assign({ class: 'input' }, inputAttrs));
    return {
      input: input,
      node: h('div', { class: 'field' }, [
        h('label', { for: inputAttrs.id, text: label }),
        input,
        hint ? h('span', { class: 'hint', text: hint }) : null
      ])
    };
  }

  function viewPlaceForm(place, prefill) {
    var editing = !!place;
    var name = field('Place name', { id: 'f-name', type: 'text', autocomplete: 'off', value: editing ? place.name : '', placeholder: 'Bluebird Coffee' });
    var lat = field('Latitude', { id: 'f-lat', type: 'text', inputmode: 'decimal', class: 'input coords', value: editing ? place.latitude : (prefill.lat || '') });
    var lon = field('Longitude', { id: 'f-lon', type: 'text', inputmode: 'decimal', class: 'input coords', value: editing ? place.longitude : (prefill.lon || '') });
    var radius = field('Recognition radius (metres)', { id: 'f-radius', type: 'number', min: '10', step: '10', inputmode: 'numeric', value: editing ? place.radiusMeters : 150 },
      'How close counts as being here.');

    var status = h('p', { class: 'captured', text: (!editing && prefill.lat) ? 'Location captured from your current position.' : '' });

    var locateBtn = h('button', { class: 'btn btn-secondary btn-block', type: 'button' }, 'Use my current location');
    locateBtn.addEventListener('click', function () {
      locateBtn.disabled = true;
      locateBtn.textContent = 'Getting location…';
      window.Loc.getCurrentPosition().then(function (fix) {
        lastFix = fix;
        lat.input.value = fix.latitude.toFixed(6);
        lon.input.value = fix.longitude.toFixed(6);
        status.dataset.state = 'ok';
        status.textContent = 'Location captured — accurate to about ' + Math.round(fix.accuracy) + ' m.';
      }).catch(function (err) {
        status.dataset.state = 'error';
        status.textContent = err.message;
      }).then(function () {
        locateBtn.disabled = false;
        locateBtn.textContent = 'Use my current location';
      });
    });

    var form = h('form', { class: 'form', novalidate: true }, [
      name.node, locateBtn, status,
      h('div', { class: 'row' }, [lat.node, lon.node]),
      radius.node,
      h('div', { class: 'actions' }, [
        h('button', { class: 'btn btn-primary btn-block', type: 'submit' }, editing ? 'Save changes' : 'Save place'),
        h('a', { class: 'btn btn-ghost btn-block', href: editing ? '#/place/' + place.id : '#/' }, 'Cancel')
      ])
    ]);

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var data = {
        name: name.input.value,
        latitude: parseFloat(lat.input.value),
        longitude: parseFloat(lon.input.value),
        radiusMeters: parseFloat(radius.input.value)
      };
      var task = editing ? window.DB.Places.update(place.id, data) : window.DB.Places.create(data);
      task.then(function (saved) {
        toast(editing ? 'Place updated.' : 'Place saved.');
        go('#/place/' + saved.id);
      }).catch(fail);
    });

    var nodes = [
      h('a', { class: 'back', href: editing ? '#/place/' + place.id : '#/' }, '← Back'),
      h('h1', { text: editing ? 'Edit place' : 'Add place' }),
      form
    ];

    if (editing) {
      var del = h('button', { class: 'btn btn-danger btn-block', type: 'button' }, 'Delete this place');
      del.addEventListener('click', function () {
        window.DB.People.listByPlace(place.id).then(function (people) {
          return askConfirm(
            'Delete ' + place.name + '?',
            people.length
              ? 'This also deletes the ' + peopleWord(people.length) + ' saved here. It cannot be undone.'
              : 'This cannot be undone.',
            'Delete place'
          ).then(function (ok) {
            if (!ok) { toast('Nothing was deleted.'); return; }
            return window.DB.Places.remove(place.id).then(function () {
              toast('Place deleted.');
              go('#/');
            });
          });
        }).catch(fail);
      });
      nodes.push(h('div', { class: 'actions' }, del));
    }

    render(nodes);
  }

  /* ---------------- person form ---------------- */

  function viewPersonForm(place, person) {
    var editing = !!person;
    var name = field('Name', { id: 'p-name', type: 'text', autocomplete: 'off', value: editing ? person.name : '', placeholder: 'Maya' });
    var role = field('Role', { id: 'p-role', type: 'text', autocomplete: 'off', value: editing ? person.role : '', placeholder: 'Barista' });
    var note = field('Memory note', { id: 'p-note', type: 'text', autocomplete: 'off', value: editing ? person.note : '', placeholder: 'Starting nursing school' });
    var say = field('Pronunciation', { id: 'p-say', type: 'text', autocomplete: 'off', value: editing ? person.pronunciation : '', placeholder: 'MY-ah' });
    var seen = field('Last seen', { id: 'p-seen', type: 'date', value: editing ? (person.lastSeenAt || '').slice(0, 10) : '' });

    var backHref = '#/place/' + place.id;

    var form = h('form', { class: 'form', novalidate: true }, [
      name.node, role.node, note.node, say.node, seen.node,
      h('div', { class: 'actions' }, [
        h('button', { class: 'btn btn-primary btn-block', type: 'submit' }, editing ? 'Save changes' : 'Save person'),
        h('a', { class: 'btn btn-ghost btn-block', href: backHref }, 'Cancel')
      ])
    ]);

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var data = {
        placeId: place.id,
        name: name.input.value,
        role: role.input.value,
        note: note.input.value,
        pronunciation: say.input.value,
        lastSeenAt: seen.input.value
      };
      var task;
      try {
        task = editing ? window.DB.People.update(person.id, data) : window.DB.People.create(data);
      } catch (err) { fail(err); return; }
      task.then(function () {
        toast(editing ? 'Saved.' : 'Person added.');
        go(backHref);
      }).catch(fail);
    });

    var nodes = [
      h('a', { class: 'back', href: backHref }, '← ' + place.name),
      h('h1', { text: editing ? 'Edit person' : 'Add person' }),
      form
    ];

    if (editing) {
      var del = h('button', { class: 'btn btn-danger btn-block', type: 'button' }, 'Delete ' + person.name);
      del.addEventListener('click', function () {
        askConfirm('Delete ' + person.name + '?', 'This cannot be undone.', 'Delete person').then(function (ok) {
          if (!ok) { toast('Nothing was deleted.'); return; }
          return window.DB.People.remove(person.id).then(function () {
            toast('Person deleted.');
            go(backHref);
          });
        }).catch(fail);
      });
      nodes.push(h('div', { class: 'actions' }, del));
    }

    render(nodes);
  }

  /* ---------------- routing ---------------- */

  function parseQuery(str) {
    var out = {};
    (str || '').split('&').forEach(function (pair) {
      if (!pair) return;
      var kv = pair.split('=');
      out[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
    });
    return out;
  }

  function route() {
    var raw = window.location.hash.replace(/^#/, '') || '/';
    var qIndex = raw.indexOf('?');
    var query = parseQuery(qIndex >= 0 ? raw.slice(qIndex + 1) : '');
    var path = (qIndex >= 0 ? raw.slice(0, qIndex) : raw).split('/').filter(Boolean);

    if (!path.length) return viewHome();
    if (path[0] === 'where') return viewWhere();
    if (path[0] === 'add-place') return viewPlaceForm(null, { lat: query.lat, lon: query.lon });

    if (path[0] === 'place' && path[1]) {
      var id = path[1];
      if (path[2] === 'edit') {
        return window.DB.Places.get(id).then(function (p) {
          return p ? viewPlaceForm(p, {}) : viewMissing();
        }).catch(fail);
      }
      if (path[2] === 'add-person') {
        return window.DB.Places.get(id).then(function (p) {
          return p ? viewPersonForm(p, null) : viewMissing();
        }).catch(fail);
      }
      return viewPlace(id);
    }

    if (path[0] === 'person' && path[1] && path[2] === 'edit') {
      return window.DB.People.get(path[1]).then(function (person) {
        if (!person) return viewMissing();
        return window.DB.Places.get(person.placeId).then(function (place) {
          return place ? viewPersonForm(place, person) : viewMissing();
        });
      }).catch(fail);
    }

    return viewHome();
  }

  window.addEventListener('hashchange', route);
  route();

})();

</script>
</body>
</html>
