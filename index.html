<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>People Here</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A private, on-device memory aid for the names of people you meet at places you frequent.">
<meta name="theme-color" content="#f3f2f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="People Here">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<header class="masthead">
  <a class="brand" href="#/">People Here</a>
  <p class="brand-sub">Who do I know here?</p>
</header>

<main id="view" tabindex="-1"></main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<div id="confirm" class="dialog-backdrop" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-body">
    <h2 class="dialog-title" id="confirm-title">Are you sure?</h2>
    <p class="dialog-body" id="confirm-body"></p>
    <div class="dialog-actions">
      <button type="button" class="btn btn-ghost" data-confirm="no">Cancel</button>
      <button type="button" class="btn btn-danger" data-confirm="yes">Delete</button>
    </div>
  </div>
</div>

<script src="./js/distance.js"></script>
<script src="./js/db.js"></script>
<script src="./js/location.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
